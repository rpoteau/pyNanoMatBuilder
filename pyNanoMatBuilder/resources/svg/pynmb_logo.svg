  <title
     id="title1">pyNanoMatBuilder logo: central node with six satellites and a convex-hull envelope on the left</title>
  <desc
     id="desc1">A turquoise cluster of one central circle linked to six outer circles, with a translucent convex-hull contour hugging the three left-hand circles.</desc>
